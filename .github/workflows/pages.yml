# Publishes the click-through from stylekit-v3-clickthrough.zip to GitHub Pages on every push to main.
name: Publish click-through

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the prototype
        run: unzip -q stylekit-v3-clickthrough.zip -d site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/stylekit-v3-clickthrough
      - id: deployment
        uses: actions/deploy-pages@v4
